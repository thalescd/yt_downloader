name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # As etapas vivem no lint.sh, que os desenvolvedores rodam localmente,
      # para que CI e máquina local não possam divergir. Sem .venv aqui, o
      # script usa as ferramentas do PATH.
      - name: Verificações (estilo, tipos e testes)
        env:
          RUFF_OUTPUT_FORMAT: github  # anotações inline nos arquivos do PR
        run: ./lint.sh
