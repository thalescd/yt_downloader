[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pyright]
pythonVersion = "3.12"
# O código nasceu Windows-first, então o risco real é uma chamada exclusiva
# do Windows sem guarda de plataforma. Fixar "Linux" faz o Pyright reprovar
# essas chamadas, aqui e no CI, mesmo quando rodado a partir do Windows.
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os módulos ficam na raiz, não num pacote instalável.
pythonpath = ["."]
addopts = "-q"
