[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pyright]
pythonVersion = "3.12"
# O app é Windows-only (os.startfile, scripts .bat). Fixar a plataforma faz
# a checagem valer o mesmo rodando no CI em Linux.
pythonPlatform = "Windows"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os módulos ficam na raiz, não num pacote instalável.
pythonpath = ["."]
addopts = "-q"
